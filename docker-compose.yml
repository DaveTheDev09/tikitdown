version: "3.8"
services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - API_URL=http://localhost:9000
      - CORS_URL=http://localhost:3000
      - API_TIMEOUT=30000
      - PROCESSING_PRIORITY=balanced
    restart: unless-stopped
